<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GEOAGRI × NEP/HGAB/DA FMR Integration</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root { --bg:#10141c; --panel:#171c27; --line:#232a3a; --tx:#e8ecf4; --dim:#8b94a7; --green:#22c55e; --blue:#3b82f6; --amber:#f59e0b; --red:#ef4444; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--tx); font:14px/1.45 system-ui, sans-serif; display:flex; height:100vh; overflow:hidden; }
  #sidebar { width:400px; min-width:400px; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; }
  #head { padding:14px 16px; border-bottom:1px solid var(--line); }
  #head h1 { font-size:15px; font-weight:600; }
  #head p { color:var(--dim); font-size:12px; margin-top:3px; }
  #filters { padding:10px 16px; border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:8px; }
  #filters input[type=search] { background:var(--bg); border:1px solid var(--line); border-radius:6px; color:var(--tx); padding:7px 10px; font-size:13px; }
  .seg { display:flex; gap:6px; flex-wrap:wrap; }
  .seg button { background:var(--bg); border:1px solid var(--line); color:var(--dim); border-radius:6px; padding:5px 10px; font-size:12px; cursor:pointer; }
  .seg button.on { background:#1e293b; color:var(--tx); border-color:#3b465e; }
  #list { flex:1; overflow-y:auto; }
  .card { padding:11px 16px; border-bottom:1px solid var(--line); cursor:pointer; }
  .card:hover { background:#1b2130; }
  .card.sel { background:#1e293b; border-left:3px solid var(--blue); }
  .card .t { font-size:13px; font-weight:500; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .card .m { display:flex; gap:6px; margin-top:5px; flex-wrap:wrap; align-items:center; }
  .chip { font-size:10.5px; padding:2px 7px; border-radius:10px; border:1px solid var(--line); color:var(--dim); }
  .chip.strong { color:#4ade80; border-color:#2b5c3a; }
  .chip.possible { color:#fbbf24; border-color:#6b5310; }
  .chip.src-nep { color:#60a5fa; }
  .chip.src-da { color:#c084fc; }
  .chip.geo-valid { color:#4ade80; }
  .card .loc { color:var(--dim); font-size:11.5px; margin-top:3px; }
  #map { flex:1; }
  #stats { padding:10px 16px; border-top:1px solid var(--line); color:var(--dim); font-size:11.5px; display:flex; gap:14px; }
  /* modal */
  #modal-bg { position:fixed; inset:0; background:rgba(5,8,14,.72); display:none; z-index:100; }
  #modal-bg.show { display:flex; align-items:center; justify-content:center; }
  #modal { width:min(860px, 92vw); max-height:86vh; background:var(--panel); border:1px solid var(--line); border-radius:12px; display:flex; flex-direction:column; overflow:hidden; }
  #modal-head { padding:14px 18px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; gap:12px; }
  #modal-head h2 { font-size:14px; font-weight:600; }
  #modal-body { padding:16px 18px; overflow-y:auto; display:flex; flex-direction:column; gap:14px; }
  .kv { display:grid; grid-template-columns:150px 1fr; gap:4px 12px; font-size:13px; }
  .kv .k { color:var(--dim); }
  .sec h3 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); margin-bottom:8px; }
  pre { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:12px; font-size:11.5px; overflow:auto; max-height:300px; }
  .btn { background:#1e293b; border:1px solid #3b465e; color:var(--tx); border-radius:6px; padding:6px 12px; font-size:12px; cursor:pointer; }
  .btn:hover { background:#26324a; }
  .loader { color:var(--dim); font-size:12px; padding:4px 0; }
  #legend { position:absolute; bottom:12px; left:12px; background:rgba(23,28,39,.92); border:1px solid var(--line); border-radius:8px; padding:10px 12px; font-size:11.5px; color:var(--dim); z-index:5; }
  .sw { display:inline-block; width:18px; height:3px; border-radius:2px; margin-right:6px; vertical-align:middle; }
</style>
</head>
<body>
<div id="sidebar">
  <div id="head">
    <h1>GEOAGRI × NEP/HGAB/DA Integration</h1>
    <p>API-harvested proposals matched to budget rows · <span id="meta-date"></span></p>
  </div>
  <div id="filters">
    <input type="search" id="q" placeholder="Search title, municipality, fmrcode…">
    <div class="seg" id="seg-tier">
      <button data-v="all" class="on">All</button>
      <button data-v="strong">Strong</button>
      <button data-v="possible">Possible</button>
      <button data-v="none">Unmatched</button>
    </div>
    <div class="seg" id="seg-src">
      <button data-v="all" class="on">NEP + DA</button>
      <button data-v="nep">NEP</button>
      <button data-v="da">DA draft</button>
    </div>
  </div>
  <div id="list"></div>
  <div id="stats"></div>
</div>
<div id="map"></div>
<div id="legend">
  <div><span class="sw" style="background:var(--green)"></span>GEOAGRI surveyed alignment</div>
  <div><span class="sw" style="background:var(--blue)"></span>NEP printed START→END chord</div>
  <div><span class="sw" style="background:var(--amber)"></span>GEOAGRI centroid</div>
</div>

<div id="modal-bg">
  <div id="modal">
    <div id="modal-head">
      <h2 id="modal-title"></h2>
      <div style="display:flex;gap:8px">
        <button class="btn" id="btn-json">Raw JSON</button>
        <button class="btn" id="btn-close">Close</button>
      </div>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<script>
const API = 'https://geoagri.bafe.gov.ph/api/fmr-proposals';
const ENRICH_URL = 'geoagri_fmr_enrichment.json';

const state = { rows: [], tier: 'all', src: 'all', q: '', sel: null, enrich: null };

const map = new maplibregl.Map({
  container: 'map',
  style: 'https://basemaps.cartocdn.com/gl/voyager-gl-style/style.json',
  center: [122, 12], zoom: 5.4
});
map.addControl(new maplibregl.NavigationControl(), 'top-right');
const popup = new maplibregl.Popup({ closeButton:false, offset:6 });

function fmtP(v){ return v ? '₱'+Number(v).toLocaleString() : '—'; }
function fmtKm(v){ return v ? Number(v).toFixed(2)+' km' : '—'; }

async function load() {
  const res = await fetch(ENRICH_URL);
  state.enrich = await res.json();
  document.getElementById('meta-date').textContent =
    'harvested ' + state.enrich.metadata.generated;
  // unified rows: NEP first, then DA
  state.rows = [
    ...state.enrich.nep_projects.map(r => ({...r, src:'nep'})),
    ...state.enrich.da_projects.map(r => ({...r, src:'da'})),
  ];
  buildList();
  const m = state.enrich.metadata;
  document.getElementById('stats').innerHTML =
    `<span>NEP ${m.nep.strong||0} strong · ${m.nep.possible||0} possible</span>` +
    `<span>DA ${m.da.strong||0} · ${m.da.possible||0}</span>` +
    `<span>HGAB link ${m.hgab_via_nep_title}</span>`;
}

function passes(r) {
  if (state.tier !== 'all') {
    if (state.tier === 'none' && r.geoagri) return false;
    if (state.tier !== 'none' && (!r.geoagri || r.geoagri.match_tier !== state.tier)) return false;
  }
  if (state.src !== 'all' && r.src !== state.src) return false;
  if (state.q) {
    const hay = [r.title, r.municipality, r.province, r.geoagri?.road_name, r.geoagri?.fmrcode]
      .filter(Boolean).join(' ').toLowerCase();
    if (!hay.includes(state.q.toLowerCase())) return false;
  }
  return true;
}

function buildList() {
  const el = document.getElementById('list');
  el.innerHTML = '';
  const rows = state.rows.filter(passes).slice(0, 400);
  for (const r of rows) {
    const d = document.createElement('div');
    d.className = 'card';
    const g = r.geoagri;
    d.innerHTML = `
      <div class="t">${r.title}</div>
      <div class="m">
        <span class="chip ${r.src==='nep'?'src-nep':'src-da'}">${r.src==='nep'?'NEP':'DA '+r.kind}</span>
        ${g ? `<span class="chip ${g.match_tier}">${g.match_tier} ${g.match_score}</span>
               <span class="chip geo-valid">${g.geometry.flag}</span>` : '<span class="chip">no match</span>'}
      </div>
      <div class="loc">${[r.municipality, r.province].filter(Boolean).join(', ')}</div>`;
    d.onclick = () => selectRow(r, d);
    el.appendChild(d);
  }
  if (!rows.length) el.innerHTML = '<div style="padding:20px;color:var(--dim)">No rows match filters.</div>';
}

function selectRow(r, cardEl) {
  document.querySelectorAll('.card.sel').forEach(e => e.classList.remove('sel'));
  if (cardEl) cardEl.classList.add('sel');
  state.sel = r;
  drawSelected(r);
}

function drawSelected(r) {
  // reset layers
  for (const id of ['nep-chord','geo-line','geo-centroid']) {
    if (map.getLayer(id)) map.removeLayer(id);
    if (map.getSource(id)) map.removeSource(id);
  }
  const g = r.geoagri;
  if (!g) { fitAll(); return; }
  const c = g.geometry.centroid;
  const center = [c.lng, c.lat];
  map.easeTo({ center, zoom: Math.max(map.getZoom(), 12) });

  // centroid marker layer
  map.addSource('geo-centroid', { type:'geojson', data: turfPoint(center) });
  map.addLayer({
    id:'geo-centroid', type:'circle', source:'geo-centroid',
    paint:{ 'circle-radius':6, 'circle-color':'#f59e0b', 'circle-stroke-width':2, 'circle-stroke-color':'#10141c' }
  });

  // fetch full geometry from detail endpoint (CORS enabled).
  // geojson is a standard MultiLineString: lines of [lng, lat] vertex arrays.
  fetch(`${API}/${g.id}/`)
    .then(r2 => r2.json())
    .then(detail => {
      const coords = detail?.coordinates?.geojson?.coordinates;
      if (!coords || !coords.length) return;
      const fc = { type:'FeatureCollection', features: coords.map(line => ({
        type:'Feature', properties:{},
        geometry:{ type:'LineString', coordinates: line }
      }))};
      if (map.getLayer('geo-line')) map.removeLayer('geo-line');
      if (map.getSource('geo-line')) map.removeSource('geo-line');
      map.addSource('geo-line', { type:'geojson', data:fc });
      map.addLayer({
        id:'geo-line', type:'line', source:'geo-line',
        paint:{ 'line-color':'#22c55e', 'line-width':3.5 }
      });
      // NEP printed START→END chord (also [lng, lat] arrays), if present
      if (r.nep_coordinates?.length) {
        const nc = { type:'FeatureCollection', features: r.nep_coordinates.map(line => ({
          type:'Feature', properties:{},
          geometry:{ type:'LineString', coordinates: line }
        }))};
        if (map.getLayer('nep-chord')) map.removeLayer('nep-chord');
        if (map.getSource('nep-chord')) map.removeSource('nep-chord');
        map.addSource('nep-chord', { type:'geojson', data:nc });
        map.addLayer({
          id:'nep-chord', type:'line', source:'nep-chord',
          paint:{ 'line-color':'#3b82f6', 'line-width':2.5, 'line-dasharray':[3,2] }
        });
      }
      // fit bounds to alignment
      const all = coords.flat();
      const b = new maplibregl.LngLatBounds();
      all.forEach(p => b.extend(p));
      map.fitBounds(b, { padding:80, duration:600 });
      g._detail = detail; // cache for modal
    })
    .catch(() => {});
}

function turfPoint(c){ return { type:'FeatureCollection', features:[{type:'Feature',properties:{},geometry:{type:'Point',coordinates:c}}]}; }

function fitAll(){ map.easeTo({ center:[122,12], zoom:5.4 }); }

// modal
function openModal() {
  const r = state.sel; if (!r) return;
  const g = r.geoagri;
  document.getElementById('modal-title').textContent = r.title;
  const body = document.getElementById('modal-body');
  let html = `
    <div class="sec"><h3>Budget row</h3><div class="kv">
      <span class="k">Source</span><span>${r.src==='nep'?'NEP 2027 FMR':'DA draft ('+r.kind+')'}</span>
      <span class="k">ID</span><span>${r.src==='nep'?r.nep_id:r.control_no}</span>
      ${r.src==='nep'&&r.hgab_id?`<span class="k">HGAB link</span><span>${r.hgab_id}</span>`:''}
      <span class="k">Amount</span><span>${fmtP(r.amount_php)}</span>
      <span class="k">Locality</span><span>${[r.municipality,r.province].filter(Boolean).join(', ')}</span>
    </div></div>`;
  if (g) {
    const L = g.location;
    html += `
      <div class="sec"><h3>GEOAGRI proposal</h3><div class="kv">
        <span class="k">Match</span><span>${g.match_tier} (score ${g.match_score})</span>
        <span class="k">API id / code</span><span>${g.id} · ${g.fmrcode}</span>
        <span class="k">Road name</span><span>${g.road_name}</span>
        <span class="k">Status</span><span>${g.status}</span>
        <span class="k">Location</span><span>${L.barangay||''}${L.barangay?', ':''}${L.municipality}, ${L.province} (${L.region})</span>
        <span class="k">Est. cost</span><span>${fmtP(g.estimate_project_cost)}</span>
        <span class="k">Length / width</span><span>${fmtKm(g.estimate_road_length)} · ${g.road_width} m</span>
        <span class="k">Counterpart</span><span>${fmtP(g.counterpart_amount)}</span>
        <span class="k">Geometry</span><span>${g.geometry.flag} · ${g.geometry.vertex_count} vertices</span>
      </div></div>`;
  } else {
    html += `<div class="sec"><h3>GEOAGRI proposal</h3>
      <p style="color:var(--dim)">No match above threshold (best score ${r.best_score_below_threshold ?? '—'}). ` +
      `The municipality may have proposals in GEOAGRI that failed title matching.</p></div>`;
  }
  html += `<div id="json-slot"></div>`;
  body.innerHTML = html;
  document.getElementById('modal-bg').classList.add('show');
}

document.getElementById('btn-close').onclick = () => document.getElementById('modal-bg').classList.remove('show');
document.getElementById('modal-bg').onclick = e => { if (e.target.id==='modal-bg') e.target.classList.remove('show'); };
document.getElementById('btn-json').onclick = () => {
  const r = state.sel; if (!r) return;
  const slot = document.getElementById('json-slot');
  if (slot.dataset.on) { slot.innerHTML=''; delete slot.dataset.on; return; }
  const payload = { budget_row: r, geoagri_cached: r.geoagri, geoagri_detail: r.geoagri?._detail };
  slot.innerHTML = `<h3 style="font-size:12px;text-transform:uppercase;color:var(--dim);margin-bottom:6px">Raw JSON</h3>
    <pre>${JSON.stringify(payload, null, 2).replace(/</g,'&lt;')}</pre>`;
  slot.dataset.on = '1';
};

// filters
for (const seg of ['seg-tier','seg-src']) {
  document.getElementById(seg).addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    b.parentElement.querySelectorAll('button').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    if (seg === 'seg-tier') state.tier = b.dataset.v; else state.src = b.dataset.v;
    buildList();
  });
}
let qt;
document.getElementById('q').addEventListener('input', e => {
  clearTimeout(qt);
  qt = setTimeout(() => { state.q = e.target.value.trim(); buildList(); }, 200);
});

map.on('load', load);
</script>
</body>
</html>
