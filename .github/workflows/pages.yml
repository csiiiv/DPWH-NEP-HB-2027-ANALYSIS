name: Publish dashboards

on:
  push:
    branches: [main]
    paths:
      - 'analysis/**'
      - 'site/**'
      - 'scripts/**'
      - 'dpwh-transparency-nep-data/**'
      - 'HB_BUDGET/*.pdf'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'analysis/**'
      - 'site/**'
      - 'scripts/**'
      - 'dpwh-transparency-nep-data/**'
      - 'HB_BUDGET/*.pdf'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check current accounting, data freshness and matching
        run: python3 -m unittest discover -s analysis/tests -p test_current_pages.py -v
      - name: Check budget display units, signs and numeric sorting
        run: node --test analysis/tests/test_budget_display.cjs
      - name: Check independent source verification and snapshot accounting
        run: python3 -m unittest discover -s analysis/tests -p test_source_verification.py -v
      - name: Check source filters and NEP API project drilldown
        run: node --test analysis/tests/test_source_verification_viewer.cjs
      - name: Check stage trace and README navigation
        run: |
          python3 -m unittest discover -s analysis/tests -p test_stage_trace.py -v
          python3 -m unittest discover -s analysis/tests -p test_static_pages.py -v
      - name: Prepare static viewers
        run: python3 scripts/build_pages.py
      - name: Check rendered homepage navigation under project base
        run: node --test analysis/tests/test_static_navigation.cjs
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy dashboards
        id: deployment
        uses: actions/deploy-pages@v4
